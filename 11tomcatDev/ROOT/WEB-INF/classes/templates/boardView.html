<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>게시판 상세보기</title><link rel="stylesheet" th:href="@{/commons/style.css}"></head>
<body>
    <h2>JPA Board</h2>
    <div class="board detail-view" th:if="${row != null}">
    <table>
    <tbody>
        <tr><th>No</th><td th:text="${row.idx}"></td><th>작성자</th><td th:text="${row.name}"></td></tr>
        <tr><th>작성일</th><td th:text="${#temporals.format(row.postdate, 'yyyy-MM-dd HH:mm')}"></td><th>조회수</th><td th:text="${row.hits}"></td></tr>
        <tr><th>제목</th><td colspan="3" th:text="${row.title}"></td></tr>
        <tr><th>내용</th><td colspan="3" th:text="${row.contents}" style="white-space: pre-wrap;"></td></tr>
    </tbody>
    </table>
    </div>
    <p th:unless="${row != null}">게시물을 찾을 수 없습니다.</p>
    <div class="form-actions" th:if="${row != null}"><button type="button" th:onclick="|location.href='@{/edit.do(idx=${row.idx})}'|">수정</button><button type="button" th:onclick="|location.href='@{/delete.do(idx=${row.idx})}'|">삭제</button><button type="button" th:onclick="|location.href='@{/list.do}'|">목록</button></div>
</body>
</html>
