<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>게시판 글쓰기</title><link rel="stylesheet" th:href="@{/commons/style.css}"></head>
<body>
    <h2>JPA Board</h2>
    <form method="post" th:action="@{/writeProc.do}">
        <div class="board write-view"><table><tbody>
            <tr><th>작성자</th><td><input type="text" name="name" style="width:200px;"></td></tr>
            <tr><th>제목</th><td><input type="text" name="title" placeholder="제목을 입력하세요"></td></tr>
            <tr><th>내용</th><td><textarea name="contents" rows="10" placeholder="내용을 입력하세요"></textarea></td></tr>
        </tbody></table></div>
        <div class="form-actions"><button type="submit">등록</button><button type="reset">취소</button><button type="button" th:onclick="|location.href='@{/list.do}'|">목록</button></div>
    </form>
</body>
</html>
